name: foodbridge
description: A new Flutter project for FoodBridge.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Navigation
  go_router: ^12.1.1
  
  # Networking
  dio: ^5.4.0
  
  # Typography & Icons
  google_fonts: ^6.1.0
  lucide_icons_flutter: ^3.1.20
  
  # Map
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # Utils
  intl: ^0.18.1
  shared_preferences: ^2.2.2

  # Backend / Database
  supabase_flutter: ^2.5.6

  # Device Hardware & Native Features
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
